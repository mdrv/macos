name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: build & test
        run: |
          cargo build
          cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --severity=style apps/*.sh
      - name: POSIX syntax check
        run: |
          set -e
          for f in apps/*.sh; do
            sh -n "$f"
          done
